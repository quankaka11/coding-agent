# docker compose up -d --build     → giao diện ở http://127.0.0.1:8080, vòng quét tự bật
#
# Hướng dẫn đầy đủ: docs/HUONG-DAN-CAI-DAT.md. Tóm tắt lần đầu:
#   mkdir workspace && cp .env.example workspace/.env              # điền token GitLab/Backlog vào ĐÂY
#   docker compose build
#   docker compose run --rm --entrypoint claude e2ea auth login    # đăng nhập Claude, dán mã từ trình duyệt
#   docker compose up -d
#
# Token GitLab/Backlog nằm trong workspace/.env, KHÔNG trong biến môi trường: sandbox của
# agent chặn đọc file đó (và file đăng nhập Claude trong volume home), nhưng trong container
# nó không gỡ được biến môi trường khỏi Bash của agent.
#
# claude.env (tuỳ chọn, cạnh file này): thay cho `claude auth login` bằng một dòng
#   CLAUDE_CODE_OAUTH_TOKEN=...   (từ `claude setup-token`, hạn 1 năm)  hoặc  ANTHROPIC_API_KEY=...
# Tiện hơn (không phải đăng nhập lại mỗi 30 ngày) nhưng agent đọc được biến này bằng `env`.
services:
  e2ea:
    build:
      context: .
      args:
        EXTRA_APT: ""            # vd "golang-go" cho repo Go
    image: e2ea:latest
    restart: unless-stopped
    env_file:
      - path: ./claude.env
        required: false
    # bubblewrap (sandbox cho lệnh Bash của agent) cần tạo namespace trong container. Nới
    # seccomp/apparmor của CONTAINER để đổi lấy sandbox cho TỪNG lệnh agent chạy — đã thử:
    # thiếu hai dòng này thì sandbox không bật và `e2ea doctor` báo ⚠.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - ./workspace:/work
      - agent-home:/home/agent       # đăng nhập Claude, cache npm/pip/go
    ports:
      # Chỉ mở cho localhost của máy chủ: giao diện đọc/ghi được token trong .env.
      - "127.0.0.1:8080:8080"
    # Dừng là dừng SAU khi run đang chạy xong; cho đủ thời gian trước khi bị giết ngang.
    stop_grace_period: 30m

volumes:
  agent-home:
