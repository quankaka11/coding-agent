# Hồ sơ repo thật: ticket ở Backlog, code ở GitLab.
# Khoá KHÔNG nằm trong file này — chúng đọc từ .env theo tên biến khai bên dưới.
repo_id: agent-coding
base_branch: main
pilot_type: infrastructure

allowed_paths:
  - "src/**"
  - "tests/**"
  # Tài liệu: sửa README/docs là việc cơ bản, G-10 (chỉ đụng file plan đã duyệt) vẫn canh.
  - "README*"
  - "CHANGELOG*"
  - "**/*.md"
  - "docs/**"
forbidden_paths:
  - "prompts/**"
  - "pyproject.toml"
  - "ci/**"
  - "**/.gitlab-ci.yml"
  - "**/.github/workflows/**"

test_globs:
  - "tests/**"
  - "**/test_*.py"
  - "**/*_test.py"

commands:
  test: "python3 -m pytest -q --junitxml={junit} -o junit_family=xunit1"
  lint: "python3 -m compileall -q src tests"
  coverage: "python3 -m pytest -q --cov=src --cov-report=json:{coverage_json}"

checks:
  build:       {status: out_of_scope, reason: "Python thuần, không có bước build riêng"}
  test:        {status: available}
  lint:        {status: available}
  typecheck:   {status: out_of_scope, reason: "repo chưa có cấu hình mypy"}
  secret_scan: {status: out_of_scope, reason: "chưa cài gitleaks trong môi trường chạy"}
  coverage:    {status: available}
  sast:        {status: out_of_scope, reason: "chưa cài semgrep trong môi trường chạy"}

limits:
  gate_fix_rounds: 2
  same_error_limit: 3
  flaky_rerun: 3
  run_timeout_min: 60
  run_cost_cap_usd: 15
  cmd_timeout_sec: 900
  coverage_new_line_pct: 80
  # Agent tự sửa (mục tiêu: người chỉ review khi thật cần) — xem README mục "Agent tự sửa".
  antigaming_fix_rounds: 2     # anti-gaming fail sửa được (G-3/G-7/G-9/G-10…) → agent sửa lại tối đa N vòng
  testgen_fix_rounds: 2        # test viết ra hỏng / pass sẵn / T2 mà đỏ / không qua tiền kiểm → agent viết lại N lần rồi mới NO_MR
  baseline_lint_fix: true      # lint đỏ sẵn → agent sửa bằng commit riêng; false = NO_MR như test đỏ

conventions:
  ac_marker: "pytest.mark.ac"
  intake_mode: assume    # assume: mơ hồ → tự chọn cách hiểu hẹp nhất, ghi giả định vào plan; ask: hỏi lại người viết ticket

mutation: {enabled: true, max_mutants: 20, timeout_sec: 300,
           per_mutant_timeout_sec: 120, min_kill_pct: 70}

tracker:
  kind: backlog
  space: testagent.backlog.com
  project: "831684"
  api_key_env: backlog_api_key

forge:
  kind: gitlab
  url: https://git.hblab.vn
  project: quannt/agent-coding
  token_env: gitlab_token

notify:
  kind: webhook
  url_env: google_chat_webhook
  events: [plan-ready, needs-human, mr-created]

agent:
  binary: claude
  # model/effort bỏ trống = lấy từ .env (agent_model, agent_effort); .env luôn ghi đè.
  # model: opus
  # effort: high
  permission_mode: auto        # auto | acceptEdits | dontAsk | bypassPermissions; hook chặn forbidden_paths chạy ở mọi mode
  allowed_tools: "Read,Write,Edit,Glob,Grep,Bash"
  timeout_sec: 1800
