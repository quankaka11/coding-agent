# Hồ sơ repo SINH TỰ ĐỘNG bởi `e2ea init`. Sửa tay tuỳ ý — lần sau init không ghi đè.
# Khoá KHÔNG nằm trong file này; chúng đọc từ .env theo tên biến khai bên dưới.
#
# ĐOÁN: bố cục src/: allowed_paths chỉ gồm src/** và thư mục test
# ĐOÁN: allowed_paths suy từ thư mục có mã nguồn: src, tests
# ĐOÁN: lint: ruff (repo có cấu hình ruff và hiện đang sạch)
# ĐOÁN: coverage: bật vì có pytest-cov, đo trên src

repo_id: ai-data-centralize
base_branch: main
pilot_type: infrastructure
allowed_paths:
- src/**
- tests/**
forbidden_paths:
- '**/.gitlab-ci.yml'
- .github/workflows/**
- ci/**
- pyproject.toml
- setup.py
- setup.cfg
- requirements*.txt
- poetry.lock
- uv.lock
- Pipfile*
- package.json
- package-lock.json
- Dockerfile*
- docker-compose*
- .env*
- prompts/**
test_globs:
- tests/**
- '**/test_*.py'
- '**/*_test.py'
# POSTGRES_DSN: Settings() bắt buộc biến này; worktree không có .env (.env* nằm trong
# forbidden_paths) nên thiếu nó là 262 test đều lỗi lúc collect. Giá trị giả là đủ —
# conftest.py monkeypatch mọi đường chạm Postgres, test không mở kết nối thật.
commands:
  test: POSTGRES_DSN=postgresql://test@127.0.0.1:5433/collect_data /home/cunx/Documents/coding-agent/venvs/ai-data-centralize/bin/python -m pytest -q --junitxml={junit}
    -o junit_family=xunit1
  lint: /home/cunx/Documents/coding-agent/venvs/ai-data-centralize/bin/python -m ruff check .
  coverage: POSTGRES_DSN=postgresql://test@127.0.0.1:5433/collect_data /home/cunx/Documents/coding-agent/venvs/ai-data-centralize/bin/python -m pytest -q --cov=src
    --cov-report=json:{coverage_json}
checks:
  build:
    status: out_of_scope
    reason: Python thuần, không có bước build riêng
  test:
    status: available
  lint:
    status: available
  typecheck:
    status: out_of_scope
    reason: 'không bật tự động: repo có lỗi mypy sẵn là baseline đỏ mãi'
  secret_scan:
    status: out_of_scope
    reason: chưa cài gitleaks trên máy chạy agent
  coverage:
    status: out_of_scope
    reason: repo có src/coverage.py và pytest đặt src/ lên sys.path, nên `import coverage`
      của pytest-cov ăn phải module của repo ("'coverage' is not a package"). Chạy ngược lại
      bằng `coverage run` thì src/index_runs.py và src/doc_index/runs.py lại ăn phải thư viện.
      Không đo được cho tới khi repo đổi tên src/coverage.py.
  sast:
    status: out_of_scope
    reason: chưa cài semgrep trên máy chạy agent
limits:
  gate_fix_rounds: 2
  same_error_limit: 3
  flaky_rerun: 3
  run_timeout_min: 60
  run_cost_cap_usd: 15
  cmd_timeout_sec: 900
  coverage_new_line_pct: 80
conventions:
  ac_marker: pytest.mark.ac
mutation:
  enabled: false
  max_mutants: 20
  timeout_sec: 300
  per_mutant_timeout_sec: 120
  min_kill_pct: 70
tracker:
  kind: backlog
  space: testagent.backlog.com
  project: '831684'
  api_key_env: backlog_api_key
forge:
  kind: gitlab
  url: https://git.hblab.vn
  project: stc/ai-workspace/ai-data-centralize
  token_env: gitlab_token
notify:
  kind: webhook
  url_env: google_chat_webhook
agent:
  binary: claude
  permission_mode: auto        # auto | acceptEdits | dontAsk | bypassPermissions; hook chặn forbidden_paths chạy ở mọi mode
  allowed_tools: Read,Write,Edit,Glob,Grep,Bash
  timeout_sec: 1800
